# swift-format owns whitespace, layout, and declaration formatting.
included:
  - Arcane Mobile
  - ArcaneWidgets
  - Shared
  - Arcane MobileTests
excluded:
  - build
  - .build
  - Packages
  - DerivedData
only_rules:
  - compiler_protocol_init
  - duplicate_imports
  - identical_operands
  - no_fallthrough_only
  - notification_center_detachment
  - prohibited_super_call
  - return_value_from_void_function
  - unneeded_break_in_switch
  - unused_closure_parameter
  - unused_control_flow_label
  - unused_enumerated
  - unused_optional_binding
  - unused_parameter
  - unused_setter_value
  - valid_ibinspectable
analyzer_rules:
  - unused_declaration
  - unused_import
